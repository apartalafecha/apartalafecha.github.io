<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4EFE4">
<title>Comparte tus fotos · Aparta la Fecha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* ===================== Temas por evento =====================
   La página es la misma para todos los eventos (/fotos/?evento=<slug>).
   Si el evento tiene tema aquí, se pinta con el estilo de su invitación;
   si no, queda el estilo general (verde y beige). */
window.AF_TEMAS = {
  "emma-evangeline": {
    clase: "tema-rosa",
    color: "#FFF6F8",
    fuentes: "family=Bree+Serif&family=Fredoka:wght@600&family=Poiret+One&family=Quicksand:wght@500;600;700&family=Sacramento",
    pre: "BABY SHOWER",
    de: "de nuestra bebé",
    nombre: ["EMMA", "EVANGELINE"],
    sub: "¡Comparte tus fotos!",
    texto: "Sube las fotos que tomes hoy. Mis papás quieren guardar cada momento.",
    mensaje: "¡Bienvenida, Emma!",
    gracias: "¡Gracias por compartir este día conmigo!"
  }
};
(function () {
  var ev = (new URLSearchParams(location.search).get("evento") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  var t = window.AF_TEMAS[ev];
  var f = t ? t.fuentes : "family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600";
  document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?' + f + '&display=swap">');
  if (t) {
    document.documentElement.className = t.clase;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t.color);
  }
  window.AF_TEMA = t || null;
})();
</script>
<style>
:root{--paper:#F4EFE4;--card:#FBF8F1;--ink:#2F3A2E;--soft:#6B7465;--sage:#5F7556;--sage-soft:#E1E8DA;--clay:#A9523A;--line:#E2D9C6;--ok:#3E6B47;--ok-soft:#DDEBDD;--no:#9A3F2E;--no-soft:#F4DED7;
  --f-display:"Cormorant Garamond",Georgia,serif;--f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{width:min(520px,100%);margin:0 auto;padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:18px}
header{text-align:center;display:grid;gap:6px}
.marca{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft)}
h1{margin:0;font-family:var(--f-display);font-size:clamp(34px,10vw,46px);line-height:1.02;font-weight:600;text-wrap:balance}
.sub{font-family:var(--f-display);font-style:italic;font-size:21px;color:var(--soft)}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
label{font-size:14px;font-weight:500}
.campo{display:grid;gap:6px}
input[type=text],textarea{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;font:inherit;width:100%}
textarea{min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
.elegir{display:grid;place-items:center;gap:6px;border:2px dashed var(--sage);border-radius:18px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--sage-soft)}
.elegir b{font-size:18px}
.elegir small{color:var(--soft)}
.elegir svg{width:40px;height:40px;color:var(--sage)}
#archivo{position:absolute;width:1px;height:1px;opacity:0}
.cola{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cola:empty{display:none}
.cola figure{margin:0;position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--line)}
.cola img{width:100%;height:100%;object-fit:cover;display:block}
.cola figcaption{position:absolute;inset:auto 0 0 0;font-size:11.5px;font-weight:600;padding:3px 6px;text-align:center;background:rgba(255,255,255,.9)}
.cola .ok figcaption{background:var(--ok-soft);color:var(--ok)} .cola .mal figcaption{background:var(--no-soft);color:var(--no)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 18px;font:600 17px var(--f-body);cursor:pointer;background:var(--sage);color:#fff;width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}
.gracias{text-align:center;display:grid;gap:10px;justify-items:center}
.gracias h2{margin:0;font-family:var(--f-display);font-size:34px;font-weight:600}
.nota{color:var(--soft);font-size:13.5px;text-align:center}
.error{text-align:center;display:grid;gap:8px}
.tema-cab,.cielo,.dino-tarjeta,.huevo-gracias{display:none}

/* ===================== Tema rosa (estilo de la invitación de Emma) ===================== */
.tema-rosa{--paper:#FFF6F8;--card:#FFFDFB;--ink:#4E3442;--soft:#7D6371;--rosa:#EC86A8;--hondo:#C04F7A;--tenue:#FCE3EC;--oro:#8A7425;
  --line:#F6CFDC;--ok:#1F7A4D;--ok-soft:#EAF2E0;--no:#B3261E;--no-soft:#FBE4E1;
  --f-display:"Bree Serif",Georgia,serif;--f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-guion:"Sacramento","Brush Script MT",cursive;--f-nombre:"Fredoka","Arial Rounded MT Bold",system-ui,sans-serif;--f-deco:"Poiret One","Quicksand",system-ui,sans-serif}
.tema-rosa body{font-weight:500;overflow-x:hidden;min-height:100vh;
  background:
    radial-gradient(closest-side,rgba(248,195,213,.75),rgba(251,217,228,.4) 55%,transparent) -170px -90px/420px 360px no-repeat,
    radial-gradient(closest-side,rgba(249,204,218,.7),rgba(252,225,234,.35) 55%,transparent) calc(100% + 190px) 360px/440px 420px no-repeat,
    radial-gradient(closest-side,rgba(249,204,218,.55),transparent) -160px calc(100% + 80px)/420px 340px no-repeat,
    radial-gradient(circle,#EF8FB0 1.4px,transparent 2px) 30px 40px/190px 230px,
    radial-gradient(circle,#EF8FB0 1px,transparent 1.5px) 90px 10px/130px 170px,
    radial-gradient(circle,#E9A4BC 1.8px,transparent 2.4px) 160px 120px/260px 310px,
    var(--paper)}
.tema-rosa .wrap{position:relative;padding-top:max(18px,env(safe-area-inset-top,0px))}
.tema-rosa .cab-general{display:none}
.tema-rosa .tema-cab{display:grid;gap:2px;justify-items:center;position:relative;padding-top:26px}
.tema-rosa .cielo{display:block;position:absolute;top:0;left:calc(-1*max(18px,env(safe-area-inset-left,0px)));right:calc(-1*max(18px,env(safe-area-inset-right,0px)));height:210px;overflow:hidden;pointer-events:none;z-index:0}
.tema-rosa .tema-cab>*:not(.cielo){position:relative;z-index:1}
.tema-rosa .tema-cab p,.tema-rosa .tema-cab h1{margin:0}
.cielo img{position:absolute;height:auto}
.cielo .nube{width:150px;left:-36px;top:4px;opacity:.85;animation:flota 9s ease-in-out infinite}
.cielo .nube.n2{width:118px;left:auto;right:-26px;top:120px;opacity:.7;animation-delay:-4s}
.cielo .mariposa{width:32px;left:7%;top:150px;animation:aleteo 3.2s ease-in-out infinite}
.cielo .mariposa.m2{width:28px;left:auto;right:9%;top:18px;animation-delay:-1.4s}
.cielo .nube{-webkit-mask-image:linear-gradient(#000 55%,transparent 98%);mask-image:linear-gradient(#000 55%,transparent 98%)}
@media (min-width:600px){.tema-rosa .cielo{overflow:visible}}
@keyframes flota{50%{transform:translateX(12px)}}
@keyframes aleteo{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-8px) rotate(8deg)}}
.tema-rosa .t-marca{font-family:var(--f-deco);letter-spacing:.3em;font-size:12px;color:var(--oro);padding-left:.3em}
.tema-rosa .t-pre{font-family:var(--f-deco);font-size:clamp(30px,9vw,40px);color:var(--oro);letter-spacing:.04em;line-height:1.1;margin-top:8px}
.tema-rosa .t-de{font-size:17px;color:var(--oro)}
.tema-rosa .t-nombre{margin:8px 0 0!important;font-family:var(--f-nombre);font-weight:600;color:var(--rosa);font-size:clamp(40px,12.5vw,58px);line-height:1.02;letter-spacing:.02em;max-width:100%;overflow-wrap:anywhere;
  text-shadow:0 2px 0 #fff,0 3px 0 #F6BBCD,0 6px 14px rgba(236,134,168,.25)}
.tema-rosa .t-nombre span{display:block}
.tema-rosa .t-huevo{width:112px;height:auto;margin-top:6px;animation:respira 3.4s ease-in-out infinite}
@keyframes respira{50%{transform:scale(1.03) translateY(-2px)}}
.tema-rosa .t-sub{font-family:var(--f-guion);font-size:clamp(46px,13vw,56px);color:var(--hondo);line-height:1;margin-top:2px}
.tema-rosa .t-texto{font-size:16.5px;max-width:30ch;color:var(--ink);margin-top:8px!important}
.tema-rosa .tarjeta{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 14px 30px -20px rgba(192,79,122,.55)}
.tema-rosa #form{position:relative;margin-top:30px}
.tema-rosa .dino-tarjeta{display:block;position:absolute;width:86px;height:auto;right:10px;top:-74px;pointer-events:none}
.tema-rosa label{font-weight:700;color:var(--ink)}
.tema-rosa input[type=text],.tema-rosa textarea{font-weight:500;color:var(--ink);background:#fff;border:1.5px solid #EFC9D7;border-radius:14px}
.tema-rosa input[type=text]::placeholder,.tema-rosa textarea::placeholder{color:#B49AA7}
.tema-rosa input[type=text]:focus,.tema-rosa textarea:focus{outline:none;border-color:var(--hondo);box-shadow:0 0 0 4px var(--tenue)}
.tema-rosa :focus-visible{outline:3px solid var(--hondo);outline-offset:3px}
.tema-rosa .elegir{border:2px dashed #EBA7BF;background:var(--tenue);border-radius:20px;color:var(--ink);transition:transform .15s ease}
.tema-rosa .elegir:hover{transform:translateY(-1px)}
.tema-rosa .elegir b{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--hondo)}
.tema-rosa .elegir svg{color:var(--hondo)}
.tema-rosa .cola figure{border-radius:14px;background:var(--tenue)}
.tema-rosa .btn{border-radius:999px;background:var(--hondo);min-height:54px;font-weight:700;box-shadow:0 10px 20px -12px rgba(192,79,122,.9)}
.tema-rosa .btn.sec{background:#fff;color:var(--hondo);border:1.5px solid #F2BCCF;box-shadow:none}
.tema-rosa .barra{background:var(--tenue)}
.tema-rosa .barra i{background:var(--rosa)}
.tema-rosa .gracias h2{font-family:var(--f-guion);font-weight:400;font-size:62px;line-height:1;color:var(--hondo)}
.tema-rosa .huevo-gracias{display:block;width:120px;height:auto}
.tema-rosa .error b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--hondo)}
.tema-rosa .pie{font-size:12.5px}
@media (prefers-reduced-motion:reduce){.cielo img,.t-huevo{animation:none!important}.tema-rosa .elegir{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cab-general">
    <p class="marca">Álbum de fotos</p>
    <h1 id="evento">Cargando…</h1>
    <p class="sub">Comparte las fotos que tomaste hoy</p>
  </header>

  <header class="tema-cab" id="tema-cab" aria-labelledby="t-titulo">
    <div class="cielo" aria-hidden="true">
      <img class="nube" src="/mesa/arte/nube.webp" alt="">
      <img class="nube n2" src="/mesa/arte/nube.webp" alt="">
      <img class="mariposa" src="/mesa/arte/mariposa.webp" alt="">
      <img class="mariposa m2" src="/mesa/arte/mariposa.webp" alt="">
    </div>
    <p class="t-marca">ÁLBUM DE FOTOS</p>
    <p class="t-pre" id="t-pre"></p>
    <p class="t-de" id="t-de"></p>
    <h1 class="t-nombre" id="t-titulo"></h1>
    <img class="t-huevo" src="/mesa/arte/huevo.webp" width="200" height="288" alt="">
    <p class="t-sub" id="t-sub"></p>
    <p class="t-texto" id="t-texto"></p>
  </header>

  <form class="tarjeta" id="form" hidden novalidate>
    <img class="dino-tarjeta" src="/mesa/arte/dino.webp" width="240" height="300" alt="">
    <div class="campo"><label for="nombre">Tu nombre (opcional)</label><input type="text" id="nombre" maxlength="60" autocomplete="name" placeholder="Para saber quién tomó las fotos"></div>
    <label class="elegir" for="archivo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <b>Elegir fotos</b><small>Puedes elegir varias a la vez</small>
    </label>
    <input type="file" id="archivo" accept="image/*" multiple>
    <div class="cola" id="cola"></div>
    <div class="campo"><label for="mensaje">Un mensaje para los anfitriones (opcional)</label><textarea id="mensaje" maxlength="200" placeholder="¡Qué bonita fiesta!"></textarea></div>
    <div class="barra" id="barra" hidden><i id="barra-i"></i></div>
    <button type="submit" class="btn" id="subir" disabled>Subir fotos</button>
    <p class="nota" id="estado">Las fotos se guardan en el álbum privado de los anfitriones.</p>
  </form>

  <section class="tarjeta gracias" id="gracias" hidden>
    <img class="huevo-gracias" src="/mesa/arte/huevo.webp" width="200" height="288" alt="">
    <h2>¡Gracias!</h2>
    <p id="gracias-txt">Tus fotos ya están en el álbum.</p>
    <button type="button" class="btn sec" id="otra">Subir más fotos</button>
  </section>

  <section class="tarjeta error" id="error" hidden><b>Este álbum no está disponible</b><span id="error-txt">Revisa que el código QR sea el del evento.</span></section>
  <p class="nota pie">Invitaciones digitales · <a href="https://www.instagram.com/apartalafecha.mx/" target="_blank" rel="noopener" style="color:inherit">Aparta la Fecha</a></p>
</div>

<script src="../config.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const EV = (qs.get("evento") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
const API = window.AF_API || "";
const TEMA = window.AF_TEMA;
const $ = id => document.getElementById(id);
let fotos = [];
try { $("nombre").value = localStorage.getItem("af-nombre") || ""; } catch (x) {}

/* Encabezado del tema (textos fijos de la invitación; no dependen de la red) */
if (TEMA) {
  $("t-pre").textContent = TEMA.pre;
  $("t-de").textContent = TEMA.de;
  TEMA.nombre.forEach(n => { const s = document.createElement("span"); s.textContent = n; $("t-titulo").appendChild(s); });
  $("t-sub").textContent = TEMA.sub;
  $("t-texto").textContent = TEMA.texto;
  if (TEMA.mensaje) $("mensaje").placeholder = TEMA.mensaje;
}

function jsonp(url) {
  return new Promise((ok, mal) => {
    const cb = "af_" + Math.random().toString(36).slice(2), s = document.createElement("script");
    const t = setTimeout(() => { fin(); mal(new Error("tiempo")); }, 20000);
    function fin() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { fin(); ok(d); }; s.onerror = () => { fin(); mal(new Error("red")); };
    s.src = url + "&callback=" + cb; document.head.appendChild(s);
  });
}
(async () => {
  try {
    if (!API || !EV) throw new Error("datos");
    const d = await jsonp(API + "?accion=evento&evento=" + encodeURIComponent(EV));
    if (!d.ok) throw new Error(d.error);
    $("evento").textContent = d.evento.nombre; document.title = "Fotos · " + d.evento.nombre;
    if (!d.evento.fotos) throw new Error("Este evento no tiene álbum de fotos activo.");
    $("form").hidden = false;
  } catch (e) {
    $("evento").textContent = "Álbum de fotos"; $("error").hidden = false;
    if (e.message === "red" || e.message === "tiempo") $("error-txt").textContent = "No hay conexión. Revisa tu señal o el wifi del salón y vuelve a abrir la página.";
    else if (e.message && e.message !== "datos") $("error-txt").textContent = e.message;
  }
})();

/* Reduce cada foto a máximo 2000 px y JPEG para que suba rápido */
function comprimir(file) {
  return new Promise((ok, mal) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 2000, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("formato")); };
    img.src = url;
  });
}
$("archivo").addEventListener("change", async e => {
  const nuevos = [...e.target.files].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name)).slice(0, 30 - fotos.length);
  e.target.value = "";
  for (const f of nuevos) {
    const fig = document.createElement("figure"); fig.innerHTML = "<figcaption>Preparando…</figcaption>"; $("cola").appendChild(fig);
    const item = { fig, datos: null, estado: "lista" }; fotos.push(item);
    try { item.datos = await comprimir(f); fig.insertAdjacentHTML("afterbegin", `<img alt="" src="${item.datos}">`); fig.querySelector("figcaption").textContent = "Lista"; }
    catch (x) { item.estado = "mal"; fig.className = "mal"; fig.querySelector("figcaption").textContent = "No se pudo leer"; }
  }
  const n = fotos.filter(f => f.estado === "lista" && f.datos).length;
  $("subir").disabled = !n;
  $("subir").textContent = n === 1 ? "Subir 1 foto" : "Subir " + n + " fotos";
});
async function enviar(obj) {
  const cuerpo = JSON.stringify(obj);
  try { const r = await fetch(API, { method: "POST", body: cuerpo }); return await r.json(); }
  catch (x) { await fetch(API, { method: "POST", mode: "no-cors", body: cuerpo }); return { ok: true, incierto: true }; }
}
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const pend = fotos.filter(f => f.estado === "lista" && f.datos); if (!pend.length) return;
  const nombre = $("nombre").value.trim(); try { localStorage.setItem("af-nombre", nombre); } catch (x) {}
  $("subir").disabled = true; $("barra").hidden = false; let hechas = 0, fallas = 0;
  for (const f of pend) {
    f.fig.querySelector("figcaption").textContent = "Subiendo…";
    try {
      const r = await enviar({ accion: "foto", evento: EV, nombre, mensaje: hechas === 0 ? $("mensaje").value.trim() : "", tipo: "image/jpeg", datos: f.datos.split(",")[1] });
      if (!r.ok) throw new Error(r.error);
      f.estado = "ok"; f.fig.className = "ok"; f.fig.querySelector("figcaption").textContent = "✓ Subida"; hechas++;
    } catch (x) { f.estado = "lista"; f.fig.className = "mal"; f.fig.querySelector("figcaption").textContent = "Reintentar"; fallas++; }
    $("barra-i").style.width = ((hechas + fallas) / pend.length * 100) + "%";
    $("estado").textContent = "Subiendo " + (hechas + fallas) + " de " + pend.length + "…";
  }
  if (!fallas) {
    $("form").hidden = true; $("gracias").hidden = false;
    $("gracias-txt").textContent = (hechas === 1 ? "Tu foto ya está en el álbum." : "Tus " + hechas + " fotos ya están en el álbum.") + (TEMA && TEMA.gracias ? " " + TEMA.gracias : "");
  } else {
    $("estado").textContent = fallas + (fallas === 1 ? " foto no se pudo subir" : " fotos no se pudieron subir") + ". Revisa tu señal y toca Subir de nuevo.";
    $("subir").disabled = false; $("subir").textContent = "Reintentar " + fallas;
  }
  $("barra").hidden = true; $("barra-i").style.width = "0";
});
$("otra").addEventListener("click", () => {
  fotos = []; $("cola").innerHTML = ""; $("mensaje").value = ""; $("subir").disabled = true; $("subir").textContent = "Subir fotos";
  $("estado").textContent = "Las fotos se guardan en el álbum privado de los anfitriones."; $("gracias").hidden = true; $("form").hidden = false;
});
</script>
</body>
</html>
