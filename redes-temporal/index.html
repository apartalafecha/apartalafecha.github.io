<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Medios temporales</title></head>
<body style="font-family:system-ui;background:#F6F3EA;color:#2F2E25;padding:16px">
<p>Carpeta temporal de Aparta la Fecha. Se borra al terminar de programar las publicaciones.</p>
<script>
window.addEventListener('message', async ev => {
  const d = ev.data || {};
  if (d.tipo !== 'alf-pide') return;
  try {
    const r = await fetch(encodeURIComponent(d.nombre), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await r.arrayBuffer();
    ev.source.postMessage({tipo: 'alf-archivo', nombre: d.nombre, datos: buf}, '*', [buf]);
  } catch (e) {
    ev.source.postMessage({tipo: 'alf-error', nombre: d.nombre, error: String(e)}, '*');
  }
});
if (window.parent !== window) window.parent.postMessage({tipo: 'alf-hola'}, '*');
</script>
</body></html>
